name: meradion
description: Premium live radio companion for Meradio'N.
publish_to: none
version: 1.0.0+1
environment: {sdk: '>=3.3.0 <4.0.0'}
dependencies:
  flutter: {sdk: flutter}
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  just_audio: ^0.9.42
  audio_service: ^0.18.15
  http: ^1.2.2
  flutter_dotenv: ^5.2.1
  livekit_client: ^2.3.5
  firebase_messaging: ^15.1.6
dev_dependencies:
  flutter_test: {sdk: flutter}
  flutter_lints: ^5.0.0
flutter: {uses-material-design: true, assets: [assets/branding/]}
